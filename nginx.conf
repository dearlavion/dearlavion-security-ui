server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API so the refresh-token cookie (SameSite=Strict, path /api/v1/auth) works. Both locations go to the shared
  # auth service ("auth" is its container/service name; adjust per deployment). Run it with
  # SESSION_COOKIE_PATH=/api/v1/auth and SESSION_COOKIE_SECURE=true, and with this UI's origin in FRONTEND_ORIGINS if it is
  # ever called cross-origin.
  location /api/v1/auth/ {
    proxy_pass http://auth:9081/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/v1/superadmin/ {
    proxy_pass http://auth:9081/superadmin/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
